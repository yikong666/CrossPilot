[project]
name = "crosspilot"
version = "0.1.0"
description = "Cross-border ecommerce decision support with governed multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.6.0",
    "neo4j>=5.28.0",
    "openai>=1.99.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyvis>=0.3.2",
    "sentence-transformers>=5.0.0",
    "streamlit>=1.47.0",
    "structlog>=25.4.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
